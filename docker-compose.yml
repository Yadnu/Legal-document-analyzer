services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # Bootstrap superuser for admin / extensions. App traffic uses legaluser.
      POSTGRES_DB: legaldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legaldb"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstackdata:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the S3 bucket and SQS queues (with DLQ) once LocalStack is healthy.
  localstack-init:
    image: amazon/aws-cli:2.22.0
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    # Use exec-form + literal block so each aws flag stays on the same
    # logical command (YAML `>` folding was splitting flags onto new lines,
    # so create-queue never ran and the worker saw QueueDoesNotExist).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ENDPOINT=http://localstack:4566
        aws --endpoint-url=$$ENDPOINT s3 mb s3://legal-documents --region us-east-1 || true
        aws --endpoint-url=$$ENDPOINT sqs create-queue --queue-name legal-ingest-dlq --region us-east-1 || true
        DLQ_ARN=$$(aws --endpoint-url=$$ENDPOINT sqs get-queue-attributes --queue-url $$ENDPOINT/000000000000/legal-ingest-dlq --attribute-names QueueArn --query Attributes.QueueArn --output text)
        aws --endpoint-url=$$ENDPOINT sqs create-queue --queue-name legal-ingest --region us-east-1 --attributes "{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"$$DLQ_ARN\\\",\\\"maxReceiveCount\\\":\\\"3\\\"}\"}" || true
        echo "LocalStack resources:"
        aws --endpoint-url=$$ENDPOINT sqs list-queues --region us-east-1
    depends_on:
      localstack:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    # Root .env supplies Clerk / Voyage / etc. Compose `environment` overrides
    # host URLs with Docker-network hosts (db, localstack).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://legaluser:legalpass@db:5432/legaldb
      CORS_ORIGINS: '["http://localhost:3000"]'
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET_NAME: legal-documents
      SQS_QUEUE_URL: http://localstack:4566/000000000000/legal-ingest
      SQS_DLQ_URL: http://localstack:4566/000000000000/legal-ingest-dlq
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "worker.main"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://legaluser:legalpass@db:5432/legaldb
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET_NAME: legal-documents
      SQS_QUEUE_URL: http://localstack:4566/000000000000/legal-ingest
      SQS_DLQ_URL: http://localstack:4566/000000000000/legal-ingest-dlq
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  localstackdata:
