repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [ts, tsx, json, css, markdown]
        files: ^frontend/

  - repo: local
    hooks:
      - id: frontend-context-graph
        name: Rebuild frontend context graph and block new token violations
        entry: npm
        language: system
        args: ["--prefix", "frontend", "run", "context:build", "--", "--check"]
        pass_filenames: false
        files: ^frontend/(src/|tailwind\.config\.ts|context/decisions\.yaml)
